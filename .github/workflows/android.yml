name: Source and Android compile
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Initialize direct pinned dependencies
        run: python3 tools/init_dependencies.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - run: python -m pip install Pillow==11.3.0
      - name: Check the lightweight source boundary
        run: python tools/audit_source.py
      - name: Compile Java and native museum without private inputs
        run: python build.py --code-only
      - name: Compile model-free device verification probes
        run: |
          cmake -S tools/experiments -B build/probes -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
          cmake --build build/probes --parallel 4
