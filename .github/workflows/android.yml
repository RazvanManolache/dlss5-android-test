name: Source and Android compile
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Initialize direct pinned dependencies
        run: python3 tools/init_dependencies.py
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android CLI
        run: |
          mkdir -p "$RUNNER_TEMP/android-cli"
          curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/cli/latest/linux_x86_64/android --output "$RUNNER_TEMP/android-cli/android"
          chmod +x "$RUNNER_TEMP/android-cli/android"
          echo "$RUNNER_TEMP/android-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/android-cli/android" --no-metrics --version
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.8.2'
      - name: Install pinned Android build tools
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install 'platforms/android-35' 'build-tools/36.0.0' 'ndk/27.3.13750724' 'cmake/3.22.1'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install Pillow==11.3.0
      - name: Check the lightweight source boundary
        run: python tools/audit_source.py
      - name: Compile Java and native museum without private inputs
        run: python build.py --code-only
      - name: Compile model-free device verification probes
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S tools/experiments -B build/probes -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build/probes --parallel 4
