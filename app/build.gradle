plugins { id 'com.android.application' }
android {
    namespace 'org.phoenix.museum'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'org.phoenix.museum'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters.addAll((project.findProperty('museumAbis') ?: 'arm64-v8a').split(',')) }
        externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging true } }
    androidResources { noCompress += ['skin', 'bones', 'mesh', 'rgba', 'dll', 'spv'] }
}
